name: Docker build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds only: the image is never pushed anywhere. This exists so a broken
      # Dockerfile fails here rather than halfway through an SSH deploy to the pi.
      # amd64 only — it will not catch an aarch64-specific failure.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
