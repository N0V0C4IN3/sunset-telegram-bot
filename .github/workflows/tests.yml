name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run still in flight for the same branch.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 to match the Dockerfile the pi actually runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # `python -m` puts the repo root on sys.path, which is what makes `import app`
      # resolve. Bare `pytest` does not, and the repo has no pytest config to do it
      # instead. This matches the command documented in CLAUDE.md.
      - run: python -m pytest tests -q
